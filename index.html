<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Microsoft YaHei', Arial, sans-serif;
  }
  canvas { display: block; border: 2px solid #0ff; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480, H = 720;
canvas.width = W;
canvas.height = H;

// --- state ---
let score = 0, highScore = parseInt(localStorage.getItem('planeWarHighScore')) || 0;
let lives = 3, gameOver = false, paused = false;
let frame = 0, enemySpawnCD = 0, difficulty = 1;

// --- player ---
const player = { x: W / 2, y: H - 100, w: 50, h: 54, speed: 6, invincible: 0 };

// --- arrays ---
let bullets = [], enemies = [], explosions = [], stars = [];

// --- stars background ---
for (let i = 0; i < 80; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.5, speed: Math.random() * 2 + 0.5 });
}

// --- input ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  if (e.key === 'p') { paused = !paused; }
  if (e.key === 'r' && gameOver) restart();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// --- restart ---
function restart() {
  score = 0; lives = 3; gameOver = false; difficulty = 1;
  bullets = []; enemies = []; explosions = [];
  player.x = W / 2; player.y = H - 100; player.invincible = 0;
}

// --- spawn enemy ---
function spawnEnemy() {
  const types = [
    { w: 40, h: 40, hp: 1, speed: 2.5, color: '#f44', points: 100 },
    { w: 50, h: 48, hp: 2, speed: 1.8, color: '#fa0', points: 200 },
    { w: 60, h: 56, hp: 4, speed: 1.2, color: '#f0f', points: 500 },
  ];
  const t = types[Math.floor(Math.random() * (difficulty < 3 ? 1 : difficulty < 6 ? 2 : 3))];
  enemies.push({
    x: Math.random() * (W - t.w - 20) + 10,
    y: -t.h,
    w: t.w, h: t.h,
    hp: t.hp, maxHp: t.hp,
    speed: t.speed + Math.random() * 1,
    color: t.color,
    points: t.points,
  });
}

// --- shoot ---
function shoot() {
  bullets.push({ x: player.x - 3, y: player.y - player.h / 2, w: 6, h: 16, speed: 8 });
  bullets.push({ x: player.x + 3, y: player.y - player.h / 2, w: 6, h: 16, speed: 8 });
}

// --- explosion ---
function explode(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    explosions.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 20 + Math.random() * 20, maxLife: 40, color: ['#ff0', '#f80', '#f00', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}

// --- update ---
function update() {
  if (gameOver || paused) return;
  frame++;

  // player movement
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2 + 40, Math.min(H - player.h / 2, player.y));
  if (player.invincible > 0) player.invincible--;

  // shooting (hold space or j)
  if ((keys[' '] || keys['j']) && frame % 10 === 0) shoot();

  // spawn enemies
  enemySpawnCD--;
  if (enemySpawnCD <= 0) {
    spawnEnemy();
    enemySpawnCD = Math.max(20, 50 - difficulty * 3);
  }

  // update bullets
  for (let b of bullets) b.y -= b.speed;
  bullets = bullets.filter(b => b.y > -20);

  // update enemies
  for (let e of enemies) e.y += e.speed;
  enemies = enemies.filter(e => {
    if (e.y > H + 60) { lives--; player.invincible = 60; return false; }
    return true;
  });

  // bullet-enemy collision
  for (let i = bullets.length - 1; i >= 0; i--) {
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i], e = enemies[j];
      if (b.x + b.w > e.x - e.w / 2 && b.x < e.x + e.w / 2 &&
          b.y + b.h > e.y - e.h / 2 && b.y < e.y + e.h / 2) {
        e.hp--;
        hit = true;
        if (e.hp <= 0) {
          explode(e.x, e.y, 12);
          score += e.points;
          enemies.splice(j, 1);
        } else {
          explode(b.x, b.y, 3);
        }
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  // player-enemy collision
  if (player.invincible === 0) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(player.x - e.x) < (player.w + e.w) / 2.5 &&
          Math.abs(player.y - e.y) < (player.h + e.h) / 2.5) {
        explode(e.x, e.y, 15);
        explode(player.x, player.y, 8);
        enemies.splice(j, 1);
        lives--;
        player.invincible = 90;
        break;
      }
    }
  }

  // update explosions
  for (let ex of explosions) { ex.x += ex.vx; ex.y += ex.vy; ex.life--; }
  explosions = explosions.filter(ex => ex.life > 0);

  // update stars
  for (let s of stars) { s.y += s.speed; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }

  // difficulty & game over
  difficulty = 1 + Math.floor(score / 1000);
  if (lives <= 0) {
    gameOver = true;
    if (score > highScore) { highScore = score; localStorage.setItem('planeWarHighScore', highScore); }
  }
}

// --- draw ---
function drawPlane(x, y, w, h, color, invincible) {
  if (invincible > 0 && Math.floor(invincible / 4) % 2 === 0) return;
  ctx.save(); ctx.translate(x, y);

  // body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -h / 2);
  ctx.lineTo(-w / 4, -h / 6);
  ctx.lineTo(-w / 2, h / 6);
  ctx.lineTo(-w / 6, h / 3);
  ctx.lineTo(0, h / 2);
  ctx.lineTo(w / 6, h / 3);
  ctx.lineTo(w / 2, h / 6);
  ctx.lineTo(w / 4, -h / 6);
  ctx.closePath();
  ctx.fill();

  // cockpit
  const grad = ctx.createRadialGradient(0, -h / 8, 2, 0, -h / 8, w / 5);
  grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#6cf');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0, -h / 8, w / 5, h / 5, 0, 0, Math.PI * 2); ctx.fill();

  // wings accent
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.moveTo(-w / 5, -h / 12); ctx.lineTo(-w / 3, h / 8); ctx.lineTo(-w / 6, h / 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w / 5, -h / 12); ctx.lineTo(w / 3, h / 8); ctx.lineTo(w / 6, h / 8); ctx.fill();

  // engine glow
  const glow = ctx.createLinearGradient(0, h / 3, 0, h / 2 + 6);
  glow.addColorStop(0, '#0cf'); glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.moveTo(-w / 6, h / 3); ctx.lineTo(w / 6, h / 3);
  ctx.lineTo(w / 4, h / 2 + 6); ctx.lineTo(-w / 4, h / 2 + 6); ctx.fill();

  ctx.restore();
}

function drawEnemy(x, y, w, h, color, hp, maxHp) {
  ctx.save(); ctx.translate(x, y);

  // body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(-w / 3, 0);
  ctx.lineTo(-w / 2, -h / 6);
  ctx.lineTo(-w / 4, -h / 3);
  ctx.lineTo(0, -h / 2 + 4);
  ctx.lineTo(w / 4, -h / 3);
  ctx.lineTo(w / 2, -h / 6);
  ctx.lineTo(w / 3, 0);
  ctx.closePath();
  ctx.fill();

  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-w / 6, -h / 10, w / 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(w / 6, -h / 10, w / 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-w / 6, -h / 10, w / 20, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(w / 6, -h / 10, w / 20, 0, Math.PI * 2); ctx.fill();

  // hp bar
  if (maxHp > 1) {
    const bw = w * 0.8, bh = 4;
    ctx.fillStyle = '#333';
    ctx.fillRect(-bw / 2, -h / 2 - 10, bw, bh);
    ctx.fillStyle = hp / maxHp > 0.5 ? '#0f0' : hp / maxHp > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(-bw / 2, -h / 2 - 10, bw * (hp / maxHp), bh);
  }

  ctx.restore();
}

function draw() {
  // background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0a2e'); bg.addColorStop(1, '#1a0a2e');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // stars
  for (let s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.5 + s.r / 3})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // player
  drawPlane(player.x, player.y, player.w, player.h, '#0af', player.invincible);

  // bullets
  ctx.fillStyle = '#ff0';
  for (let b of bullets) {
    ctx.shadowColor = '#ff0'; ctx.shadowBlur = 6;
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.shadowBlur = 0;
  }

  // enemies
  for (let e of enemies) drawEnemy(e.x, e.y, e.w, e.h, e.color, e.hp, e.maxHp);

  // explosions
  for (let ex of explosions) {
    const alpha = ex.life / ex.maxLife;
    ctx.fillStyle = ex.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, 2 + (1 - alpha) * 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // hud
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Microsoft YaHei", Arial';
  ctx.fillText(`分数: ${score}`, 16, 30);
  ctx.fillText(`最高: ${highScore}`, 16, 54);

  // lives
  ctx.fillText('生命: ', W - 120, 30);
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    const hx = W - 50 + i * 24, hy = 22;
    ctx.moveTo(hx, hy - 8); ctx.lineTo(hx - 6, hy + 4); ctx.lineTo(hx + 6, hy + 4); ctx.closePath();
    ctx.fill();
  }

  // pause
  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '40px "Microsoft YaHei", Arial';
    ctx.textAlign = 'center'; ctx.fillText('暂停', W / 2, H / 2); ctx.textAlign = 'start';
  }

  // game over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44'; ctx.font = 'bold 48px "Microsoft YaHei", Arial';
    ctx.fillText('游戏结束', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff'; ctx.font = '22px "Microsoft YaHei", Arial';
    ctx.fillText(`最终分数: ${score}`, W / 2, H / 2 + 10);
    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#ff0'; ctx.fillText('新最高分!', W / 2, H / 2 + 40);
    }
    ctx.fillStyle = '#aaa'; ctx.font = '18px "Microsoft YaHei", Arial';
    ctx.fillText('按 R 键重新开始', W / 2, H / 2 + 75);
    ctx.textAlign = 'start';
  }
}

// --- game loop ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
